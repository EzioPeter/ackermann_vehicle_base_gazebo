TrajectoryPlannerROS:
  max_vel_x: 0.8
  min_vel_x: 0.0
  max_vel_theta: 1.0
  min_in_place_vel_theta: 0.3

  acc_lim_x: 1.2
  acc_lim_theta: 1.5

  holonomic_robot: false
  meter_scoring: true

  yaw_goal_tolerance: 0.25
  xy_goal_tolerance: 0.3
  latch_xy_goal_tolerance: false

  sim_time: 1.5
  sim_granularity: 0.05
  angular_sim_granularity: 0.1

  pdist_scale: 0.8
  gdist_scale: 0.6
  occdist_scale: 0.1

  vx_samples: 8
  vtheta_samples: 20
